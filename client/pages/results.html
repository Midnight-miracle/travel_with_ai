<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Trip — AI Travel Planner</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/results.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">
        <span class="logo-mark" aria-hidden="true"></span> AI Travel <em>Planner</em>
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="../index.html">Home</a>
        <a href="planner.html">Plan a Trip</a>
        <a href="saved-trips.html">Saved Trips</a>
      </nav>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </header>

  <main class="container results-layout">
    <!-- Shown when opened directly without a trip -->
    <section class="card" id="empty-state" hidden>
      <h2>No trip yet</h2>
      <p style="color: var(--muted);">
        Fill in the trip form first and your generated plan will appear here.
      </p>
      <a class="btn btn-primary" href="planner.html">Plan a trip →</a>
    </section>

    <div id="trip-content">
      <section class="card trip-banner">
        <div class="route" id="banner-route">— → —</div>
        <div class="meta" id="banner-meta"></div>
      </section>

      <div class="results-grid" id="results-grid">
        <section class="card result-card" id="transport-card"></section>
        <section class="card result-card" id="stays-card"></section>
        <section class="card result-card full" id="itinerary-card"></section>
        <section class="card result-card full" id="budget-card"></section>
      </div>

      <p style="margin-top: 1.4rem;">
        <a class="btn btn-ghost" href="planner.html">← Plan another trip</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-year>2026</span> AI Travel Planner</span>
      <nav>
        <a href="planner.html">Plan a trip</a>
        <a href="../index.html">Home</a>
      </nav>
    </div>
  </footer>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/results.js"></script>
</body>
</html>
